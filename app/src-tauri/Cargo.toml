[package]
name = "mira"
version = "0.1.0"
edition = "2021"

[lib]
name = "slop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
# unstable: the preview opens pages from the web in a webview of their own (src/browser.rs).
tauri = { version = "2", features = ["unstable"] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-clipboard-manager = "2"

# The webview's own widget, to take a touchpad pinch before WebKitGTK does (src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

# The preview's screenshot for Claude, WebKit's own snapshot of the window
# (src/mcp.rs), and Claude's clicks and keys as AppKit events (src/browser.rs).
# Already in the build through wry; named here to call them.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSData", "NSDictionary", "NSError", "NSGeometry", "NSProcessInfo", "NSString", "NSValue"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSApplication", "NSBitmapImageRep", "NSEvent", "NSGraphicsContext", "NSImage", "NSImageRep", "NSMenu", "NSResponder", "NSView", "NSWindow"] }
objc2-web-kit = { version = "0.3", default-features = false, features = ["std", "WKWebView", "WKSnapshotConfiguration", "block2", "objc2-app-kit"] }
block2 = "0.6"

[dev-dependencies]
tempfile = "3"
