[package]
name = "understand-slop"
version = "0.1.0"
edition = "2021"

[lib]
name = "slop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.9"
tauri-plugin-clipboard-manager = "2"

# The webview's own widget, to take a touchpad pinch before WebKitGTK does (src/lib.rs).
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[dev-dependencies]
tempfile = "3"
