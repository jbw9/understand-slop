ntrollerRegistrationManager\",\"Sends KIP-919 registration RPCs on metadata change\"],[\"DynamicConfigPublisher\",\"Applies dynamic broker configuration changes\"],[\"DynamicClientQuotaPublisher\",\"Applies client quota changes\"],[\"DynamicTopicClusterQuotaPublisher\",\"Applies topic and cluster quota changes\"],[\"ScramPublisher\",\"Updates SCRAM credentials in the credential provider\"],[\"DelegationTokenPublisher\",\"Updates delegation tokens in the token manager\"],[\"ControllerMetadataMetricsPublisher\",\"Publishes controller metadata metrics\"],[\"AclPublisher\",\"Syncs ACLs to the authorizer\"]]}]},{\"id\":\"ct-registration\",\"title\":\"Controller Registration\",\"sub\":\"Keep this controller known to the active quorum\",\"state\":\"derived\",\"col\":0,\"row\":2,\"group\":{\"ordering\":\"sequence\"},\"detail\":\"`ControllerRegistrationManager` implements `MetadataPublisher` and uses a `KafkaEventQueue` to send `ControllerRegistrationRequest` RPCs, retrying with exponential backoff on failure.\",\"explain\":{\"body\":\"KIP-919 requires every controller to register itself with the quorum so the cluster knows its features and listeners. The `ControllerRegistrationManager` does this by reacting to metadata updates: when it sees the metadata version supports registration and it is not yet registered, it sends a registration RPC to the active controller.\"},\"code\":[{\"file\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java\",\"start\":55,\"end\":137,\"label\":\"Class definition, state fields, and constructor\"},{\"file\":\"core/src/main/scala/kafka/server/ControllerServer.scala\",\"start\":317,\"end\":327,\"label\":\"Created and added as a publisher during startup\"}],\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Registration lifecycle\",\"boxes\":[{\"id\":\"loader\",\"label\":\"Metadata Loader\",\"sub\":\"delivers metadata batches\",\"col\":0,\"row\":0},{\"id\":\"meta-handler\",\"label\":\"Metadata Handler\",\"sub\":\"filters and updates state\",\"col\":1,\"row\":0,\"opens\":\"ct-reg-metadata\"},{\"id\":\"send-decision\",\"label\":\"Send Decision\",\"sub\":\"five preconditions\",\"col\":2,\"row\":0,\"opens\":\"ct-reg-send\"},{\"id\":\"active-ctrl\",\"label\":\"Raft Leader\",\"sub\":\"active controller\",\"col\":3,\"row\":0},{\"id\":\"resp-handler\",\"label\":\"Response Handler\",\"sub\":\"success or retry\",\"col\":2,\"row\":1,\"opens\":\"ct-reg-response\"}],\"arrows\":[{\"from\":\"loader\",\"to\":\"meta-handler\",\"label\":\"onMetadataUpdate\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:194\"},{\"from\":\"meta-handler\",\"to\":\"send-decision\",\"label\":\"maybeSend\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:232\"},{\"from\":\"send-decision\",\"to\":\"active-ctrl\",\"label\":\"sends RPC\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:271\"},{\"from\":\"active-ctrl\",\"to\":\"resp-handler\",\"label\":\"response\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:280\"},{\"from\":\"resp-handler\",\"to\":\"send-decision\",\"label\":\"retry on failure\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:347\"}]}],\"edges\":[{\"from\":\"ct-reg-metadata\",\"to\":\"ct-reg-send\",\"state\":\"derived\",\"label\":\"calls maybeSend\",\"order\":1},{\"from\":\"ct-reg-send\",\"to\":\"ct-reg-response\",\"state\":\"derived\",\"label\":\"RPC response\",\"order\":2}],\"children\":[{\"id\":\"ct-reg-metadata\",\"title\":\"Reacting To Metadata\",\"sub\":\"Enqueue update when features or own registration changes\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`onMetadataUpdate` filters for feature or own-registration changes, enqueues a `MetadataUpdateEvent` that updates `metadataVersion` and `registeredInLog`, then calls `maybeSendControllerRegistration`.\",\"explain\":{\"body\":\"The MetadataLoader calls `onMetadataUpdate` after every metadata batch. The manager only cares about two kinds of change: a new metadata version (which might now support registration) and a change to this node's own controller registration in the log.\"},\"code\":[{\"file\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java\",\"start\":193,\"end\":237,\"label\":\"onMetadataUpdate and MetadataUpdateEvent\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Filter relevant deltas\",\"detail\":\"Only enqueues an event if the features delta is non-null or the cluster delta contains this node's controller id.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:195-198\"},{\"n\":2,\"title\":\"Update metadataVersion\",\"detail\":\"If features changed, reads the new `metadataVersion` from the image.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:214-216\"},{\"n\":3,\"title\":\"Check own registration\",\"detail\":\"If this node's registration changed, sets `registeredInLog` to true if the incarnation id matches, false otherwise.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:217-231\"},{\"n\":4,\"title\":\"Attempt registration\",\"detail\":\"Calls `maybeSendControllerRegistration()` to check preconditions and potentially send an RPC.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:232\"}]}]},{\"id\":\"ct-reg-send\",\"title\":\"Sending Registration\",\"sub\":\"Decide and send a ControllerRegistrationRequest\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`maybeSendControllerRegistration` checks five preconditions before `sendControllerRegistration` builds and sends a request with this node's id, incarnation, features, and listeners.\",\"explain\":{\"body\":\"Five conditions must all be met before sending: not already registered, channel manager initialized, metadata version known, metadata version supports KIP-919 (3.7+), and no pending RPC in flight.\"},\"code\":[{\"file\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java\",\"start\":239,\"end\":274,\"label\":\"maybeSendControllerRegistration and sendControllerRegistration\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Check already registered\",\"detail\":\"If `registeredInLog` is true, returns immediately.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:241-242\"},{\"n\":2,\"title\":\"Check channel manager\",\"detail\":\"If `channelManager` is null (not yet started), returns.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:243-244\"},{\"n\":3,\"title\":\"Check metadata version\",\"detail\":\"Returns if metadata version is unknown or does not support controller registration (pre-3.7).\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:245-249\"},{\"n\":4,\"title\":\"Check no pending RPC\",\"detail\":\"If an RPC is already in flight, waits for it to complete.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:250-251\"},{\"n\":5,\"title\":\"Build and send request\",\"detail\":\"Constructs `ControllerRegistrationRequestData` with node id, incarnation, features, listeners, and `zkMigrationReady=false`, sends via channel manager.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:257-274\"}]}]},{\"id\":\"ct-reg-response\",\"title\":\"Handling The Response\",\"sub\":\"Process the registration response or schedule retry\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"`RequestCompleteEvent` clears `pendingRpc`, checks for auth, version, or error-code failures, and on failure schedules retry with exponential backoff from 100ms to 120s.\",\"explain\":{\"body\":\"The response handler distinguishes success from several failure modes — authentication error, version mismatch, null body, wrong response type, and application-level error codes. On any failure it increments `failedRpcs` and schedules a deferred event with exponential backoff capped at two minutes.\"},\"code\":[{\"file\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java\",\"start\":289,\"end\":348,\"label\":\"RequestCompleteEvent, RequestTimeoutEvent, and retry scheduling\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Clear pending flag\",\"detail\":\"Sets `pendingRpc = false` so a new RPC can be attempted.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:299\"},{\"n\":2,\"title\":\"Check for errors\",\"detail\":\"Checks authentication exception, version mismatch, null body, invalid response type, and application error code — any triggers retry.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:300-321\"},{\"n\":3,\"title\":\"On success\",\"detail\":\"Increments `successfulRpcs`, resets `failedRpcs` to zero. No further action — the metadata update callback will detect the persisted registration.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:314-317\"},{\"n\":4,\"title\":\"Schedule retry on failure\",\"detail\":\"Computes backoff delay from `failedRpcs` (100ms base, 2x factor, 120s cap, 2% jitter), increments `failedRpcs`, schedules deferred `maybeSendControllerRegistration`.\",\"state\":\"derived\",\"at\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java:336-348\"}]}]}]},{\"id\":\"ct-shutdown\",\"title\":\"Controller Shutdown\",\"sub\":\"Orderly teardown of all controller components\",\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"`shutdown()` first resigns Raft leadership for a smooth transition. It then closes the registration manager, publishers, socket server, QuorumController, quotas, and policies in order.\",\"explain\":{\"body\":\"Shutdown runs in a deliberate order: resign Raft leadership so another node can take over quickly, then tear down components roughly in reverse order of creation. Each close is wrapped in `Utils.closeQuietly` or `Utils.swallow` so one failure does not prevent the rest from running.\"},\"code\":[{\"file\":\"core/src/main/scala/kafka/server/ControllerServer.scala\",\"start\":447,\"end\":499,\"label\":\"The shutdown() method\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Transition to SHUTTING_DOWN\",\"detail\":\"Returns immediately if status is not STARTED.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:448\"},{\"n\":2,\"title\":\"Resign Raft leadership\",\"detail\":\"Calls `sharedServer.ensureNotRaftLeader()` so another node takes over before this one's socket server stops.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:453\"},{\"n\":3,\"title\":\"Close registration manager\",\"detail\":\"Closes `registrationManager` and shuts down `registrationChannelManager`, nulling both.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:455-459\"},{\"n\":4,\"title\":\"Remove metadata publishers\",\"detail\":\"Calls `loader.removeAndClosePublisher` for each publisher, blocking on each future, then clears the list.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:461-471\"},{\"n\":5,\"title\":\"Stop socket server and controller\",\"detail\":\"Stops request processing, begins controller shutdown, then fully shuts down the socket server, handler pool, and APIs.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:472-481\"},{\"n\":6,\"title\":\"Clean up remaining resources\",\"detail\":\"Closes quotas, controller, metrics, authorizer, policies, completes the first-bound-port future exceptionally, and clears dynamic config.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:482-491\"},{\"n\":7,\"title\":\"Transition to SHUTDOWN\",\"detail\":\"Sets status to SHUTDOWN and signals `awaitShutdownCond` so `awaitShutdown()` callers unblock.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:497\"}]}]}]},{\"id\":\"adding-a-voter\",\"title\":\"Adding A Voter\",\"sub\":\"Dynamically add a voter to the KRaft quorum\",\"footprint\":{\"dirs\":[\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java\",\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandlerState.java\"],\"files\":2},\"group\":{\"ordering\":\"sequence\"},\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"An operator-triggered protocol in `AddVoterHandler`: validate preconditions, send API_VERSIONS to the new voter, check its kraft.version and lag, append a `VotersRecord`, and optionally wait for commit.\",\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java\",\"start\":43,\"end\":81,\"label\":\"Protocol algorithm documented in the class Javadoc\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java\",\"start\":97,\"end\":107,\"label\":\"Constructor wiring dependencies\"}],\"explain\":{\"body\":\"KRaft is Kafka's built-in Raft consensus layer. A *voter* is a node that participates in leader elections. This root covers the protocol that lets an operator add a new voter at runtime without restarting the cluster.\"},\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Add-voter protocol\",\"boxes\":[{\"id\":\"operator\",\"label\":\"Operator\",\"sub\":\"sends AddVoter RPC\",\"col\":0,\"row\":0},{\"id\":\"request\",\"label\":\"Accept Request\",\"sub\":\"5 precondition checks\",\"col\":1,\"row\":0,\"opens\":\"av-request\"},{\"id\":\"new-voter\",\"label\":\"New voter node\",\"sub\":\"target of API_VERSIONS\",\"col\":2,\"row\":1},{\"id\":\"response\",\"label\":\"Handle API Versions\",\"sub\":\"version + lag checks\",\"col\":2,\"row\":0,\"opens\":\"av-response\"},{\"id\":\"state\",\"label\":\"In-Flight State\",\"sub\":\"one pending operation\",\"col\":1,\"row\":1,\"opens\":\"av-state\"},{\"id\":\"commit\",\"label\":\"Complete On Commit\",\"sub\":\"HWM passes offset\",\"col\":3,\"row\":0,\"opens\":\"av-commit\"},{\"id\":\"log\",\"label\":\"Raft log\",\"sub\":\"VotersRecord appended\",\"col\":3,\"row\":1}],\"arrows\":[{\"from\":\"operator\",\"to\":\"request\",\"label\":\"AddVoter RPC\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:125\"},{\"from\":\"request\",\"to\":\"state\",\"label\":\"creates pending state\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:230\"},{\"from\":\"request\",\"to\":\"new-voter\",\"label\":\"API_VERSIONS req\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:205\"},{\"from\":\"new-voter\",\"to\":\"response\",\"label\":\"API_VERSIONS resp\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:265\"},{\"from\":\"response\",\"to\":\"log\",\"label\":\"appends VotersRecord\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:392\"},{\"from\":\"commit\",\"to\":\"state\",\"label\":\"clears pending op\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:427\"}]},{\"kind\":\"sequence\",\"caption\":\"Full add-voter exchange\",\"actors\":[\"Operator\",\"Leader\",\"New voter\",\"Raft log\"],\"rows\":[{\"from\":\"Operator\",\"to\":\"Leader\",\"label\":\"AddVoter(voterKey, endpoints, ackWhenCommitted)\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:125-131\"},{\"from\":\"Leader\",\"to\":\"New voter\",\"label\":\"API_VERSIONS request\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:205-220\"},{\"from\":\"New voter\",\"to\":\"Leader\",\"label\":\"supported kraft.version range\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:265-271\"},{\"from\":\"Leader\",\"to\":\"Raft log\",\"label\":\"append VotersRecord with new voter\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:371-392\"},{\"from\":\"Raft log\",\"to\":\"Leader\",\"label\":\"HWM advances past offset\",\"note\":\"clears pending op; completes response if ackWhenCommitted\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:415-431\"},{\"from\":\"Leader\",\"to\":\"Operator\",\"label\":\"AddVoter success response\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:396\"}]}],\"edges\":[{\"from\":\"av-request\",\"to\":\"av-response\",\"state\":\"derived\",\"label\":\"API_VERSIONS round trip\",\"order\":1},{\"from\":\"av-response\",\"to\":\"av-commit\",\"state\":\"derived\",\"label\":\"HWM advance\",\"order\":2}],\"children\":[{\"id\":\"av-request\",\"title\":\"Accepting The Request\",\"sub\":\"Five precondition checks, then API_VERSIONS send\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`handleAddVoterRequest` runs five checks — pending operation, HWM, kraft.version, uncommitted voters, duplicate id — then sends an `API_VERSIONS` request and creates `AddVoterHandlerState`.\",\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java\",\"start\":125,\"end\":243,\"label\":\"handleAddVoterRequest: all precondition checks and API_VERSIONS send\"}],\"explain\":{\"body\":\"Before the leader can add a voter it must confirm the cluster is ready: it has fenced previous leaders, supports reconfiguration, has no pending voter change, and the voter id is new.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Check no pending voter change\",\"detail\":\"If another add or remove is already in progress, return REQUEST_TIMED_OUT immediately.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:134-146\"},{\"n\":2,\"title\":\"Check HWM is established\",\"detail\":\"The leader must have fenced previous leaders; without a known high watermark, return REQUEST_TIMED_OUT.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:149-157\"},{\"n\":3,\"title\":\"Check kraft.version supports reconfig\",\"detail\":\"If `lastKraftVersion()` does not support reconfiguration (\u003c 1), return UNSUPPORTED_VERSION.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:160-172\"},{\"n\":4,\"title\":\"Check no uncommitted VotersRecord\",\"detail\":\"If the last VotersRecord offset is at or above the HWM, a previous change has not committed yet; return REQUEST_TIMED_OUT.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:175-187\"},{\"n\":5,\"title\":\"Check voter id is not duplicate\",\"detail\":\"If the voter's id is already in the current voter set, return DUPLICATE_VOTER.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:190-202\"},{\"n\":6,\"title\":\"Send API_VERSIONS to new voter\",\"detail\":\"Resolve the new voter's address from its endpoints for the sender's listener, and send the request. Return REQUEST_TIMED_OUT if the send fails.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:205-228\"},{\"n\":7,\"title\":\"Create pending state\",\"detail\":\"Build an `AddVoterHandlerState` with a timeout timer, store it via `resetAddVoterHandlerState`, and return its future.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:230-243\"}]},{\"kind\":\"table\",\"caption\":\"Rejection errors\",\"columns\":[\"Check\",\"Error returned\"],\"state\":\"derived\",\"rows\":[[\"Pending voter change exists\",\"REQUEST_TIMED_OUT\"],[\"No high watermark\",\"REQUEST_TIMED_OUT\"],[\"kraft.version \u003c 1\",\"UNSUPPORTED_VERSION\"],[\"Uncommitted VotersRecord\",\"REQUEST_TIMED_OUT\"],[\"Voter id already in set\",\"DUPLICATE_VOTER\"],[\"Send to new voter fails\",\"REQUEST_TIMED_OUT\"]]}]},{\"id\":\"av-response\",\"title\":\"Handling API Versions\",\"sub\":\"Version and lag validation, VotersRecord append\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`handleApiVersionsResponse` checks the response matches the pending voter, validates its kraft.version range and replication lag, then appends an updated `VotersRecord` to the log.\",\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java\",\"start\":265,\"end\":399,\"label\":\"handleApiVersionsResponse: version/lag validation and VotersRecord append\"}],\"explain\":{\"body\":\"After sending API_VERSIONS to the new voter, the leader must confirm the voter runs a compatible kraft.version and has caught up to the log. Only then does it write the new voter set to the Raft log.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Check pending state exists\",\"detail\":\"If no add-voter operation is pending, ignore the response.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:273-277\"},{\"n\":2,\"title\":\"Match response to pending voter\",\"detail\":\"Verify the response source id matches the pending voter and that no offset has been set yet (still awaiting API response).\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:280-290\"},{\"n\":3,\"title\":\"Check API_VERSIONS error\",\"detail\":\"If the response carries an error, abort the operation with REQUEST_TIMED_OUT and return false so the caller treats it as unsuccessful.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:293-312\"},{\"n\":4,\"title\":\"Validate kraft.version range\",\"detail\":\"Call `validVersionRange` to check the new voter's supported range covers the cluster's finalized version; abort with INVALID_REQUEST if not.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:315-347\"},{\"n\":5,\"title\":\"Check replica is caught up\",\"detail\":\"If `isReplicaCaughtUp` returns false, abort with REQUEST_TIMED_OUT to avoid delaying HWM progress.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:350-368\"},{\"n\":6,\"title\":\"Append VotersRecord\",\"detail\":\"Build a new `VoterSet` with the added voter, append it to the log via `leaderState.appendVotersRecord`, and record the offset.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:371-392\"},{\"n\":7,\"title\":\"Early ack if not waiting for commit\",\"detail\":\"If `ackWhenCommitted` is false, complete the future with success immediately without clearing the pending state.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:393-397\"}]},{\"kind\":\"facts\",\"rows\":[{\"label\":\"Return value\",\"value\":\"Returns false only when API_VERSIONS itself errored, signalling the caller to treat it as unsuccessful; true in all other cases\",\"state\":\"derived\"},{\"label\":\"validVersionRange\",\"value\":\"Checks min \u003c= finalized \u003c= max from the SupportedFeatureKey; returns false if key is absent\",\"state\":\"derived\"}]}],\"issues\":[{\"title\":\"Version range format string has unbalanced parenthesis\",\"detail\":\"The error message format for an incompatible kraft.version uses `\\\"(min: %s, max: %s\\\"` with an opening parenthesis but no closing one, producing a malformed log/error message.\",\"where\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:335\"}]},{\"id\":\"av-commit\",\"title\":\"Completing On Commit\",\"sub\":\"HWM callback that clears pending state\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"`highWatermarkUpdated` checks whether the HWM has advanced past the appended VotersRecord's offset. If so, it resets the handler state, completing the response future if `ackWhenCommitted` was true.\",\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java\",\"start\":415,\"end\":432,\"label\":\"highWatermarkUpdated: clear pending op when committed\"}],\"explain\":{\"body\":\"A VotersRecord is only durable once the high watermark (the offset replicated to a majority) passes it. This callback is the gate that unblocks the next voter-change operation.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Check pending state and offset\",\"detail\":\"Only proceed if there is a pending add-voter state and it has a recorded lastOffset (VotersRecord was appended).\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:418-421\"},{\"n\":2,\"title\":\"Compare HWM to offset\",\"detail\":\"If `highWatermark \u003e lastOffset`, the record is committed. Reset the handler state with NONE, completing the future if it was not already completed.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandler.java:422-429\"}]}]},{\"id\":\"av-state\",\"title\":\"In-Flight State\",\"sub\":\"Tracks a single pending add-voter operation\",\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"`AddVoterHandlerState` holds the voter identity, endpoints, ack preference, a timeout timer, and the `CompletableFuture` for the response. `lastOffset` starts empty and is set once the VotersRecord is appended.\",\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/internals/AddVoterHandlerState.java\",\"start\":36,\"end\":148,\"label\":\"AddVoterHandlerState: full class\"}],\"explain\":{\"body\":\"Only one add-voter operation can be in flight at a time. This object is that operation's memory — created when the API_VERSIONS request is sent and cleared when the change commits or is aborted.\"},\"anatomy\":[{\"kind\":\"schema\",\"table\":\"AddVoterHandlerState\",\"rows\":[{\"name\":\"voterKey\",\"type\":\"ReplicaKey\",\"state\":\"derived\",\"note\":\"Id and directory id of the voter being added\"},{\"name\":\"voterEndpoints\",\"type\":\"Endpoints\",\"state\":\"derived\",\"note\":\"Network endpoints of the new voter\"},{\"name\":\"ackWhenCommitted\",\"type\":\"boolean\",\"state\":\"derived\",\"note\":\"True: respond only after commit; false: respond on append\"},{\"name\":\"timeout\",\"type\":\"Timer\",\"state\":\"derived\",\"note\":\"Deadline for the whole operation\"},{\"name\":\"future\",\"type\":\"CompletableFuture\u003cAddRaftVoterResponseData\u003e\",\"state\":\"derived\",\"note\":\"Completed with the response when done or aborted\"},{\"name\":\"lastOffset\",\"type\":\"OptionalLong\",\"state\":\"derived\",\"note\":\"Empty until VotersRecord appended; set exactly once\"}]},{\"kind\":\"facts\",\"rows\":[{\"label\":\"expectingApiResponse\",\"value\":\"True when lastOffset is empty and replicaId matches voterKey — gates whether an API_VERSIONS response is relevant\",\"state\":\"derived\"},{\"label\":\"setLastOffset guard\",\"value\":\"Throws IllegalStateException if called twice, preventing double-append\",\"state\":\"d
