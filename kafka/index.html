trol record appended to the Raft log to change the set of voters in the quorum.\"},{\"term\":\"SharedServer\",\"meaning\":\"A Scala object holding the RaftManager, metadata loader, and other services shared by broker and controller.\"},{\"term\":\"kraft.version\",\"meaning\":\"A feature flag (0 or 1) that gates dynamic voter reconfiguration in KRaft.\"}],\"walkthrough\":{\"title\":\"A new KRaft controller boots and joins the quorum\",\"steps\":[{\"title\":\"Process starts\",\"detail\":\"Kafka.main parses CLI arguments, creates a KafkaRaftServer, and calls startup().\",\"path\":[\"starting-the-server\",\"st-entry\"]},{\"title\":\"Shared services start\",\"detail\":\"SharedServer creates a KafkaRaftManager that connects to the Raft network and begins participating.\",\"path\":[\"starting-the-server\",\"st-shared\",\"st-shared-start\"]},{\"title\":\"Quorum elects a leader\",\"detail\":\"QuorumState transitions through Unattached, Prospective, Candidate, until one node wins a majority vote.\",\"path\":[\"forming-the-quorum\",\"rq-quorum-state\",\"rq-qs-election\"]},{\"title\":\"Controller starts serving\",\"detail\":\"ControllerServer.startup() builds a QuorumController, wires API handlers, and begins processing requests.\",\"path\":[\"running-the-controller\",\"ct-startup\",\"ct-startup-quorum\"]},{\"title\":\"Controller registers itself\",\"detail\":\"ControllerRegistrationManager sends a registration request so the active controller knows about this node.\",\"path\":[\"running-the-controller\",\"ct-registration\",\"ct-reg-send\"]}]}},\"AUTHORED\":[{\"id\":\"starting-the-server\",\"title\":\"Starting The Server\",\"sub\":\"Boot a KRaft node and wire shared services\",\"footprint\":{\"dirs\":[\"core/src/main/scala/kafka/Kafka.scala\",\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\",\"core/src/main/scala/kafka/server/SharedServer.scala\"],\"files\":3},\"group\":{\"ordering\":\"sequence\"},\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`Kafka.main` parses CLI arguments, creates a `KafkaRaftServer`, and calls `startup()`. The server validates log directories, builds a `SharedServer`, and conditionally creates broker and controller components from `process.roles`.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/Kafka.scala\",\"start\":73,\"end\":115,\"label\":\"main: builds server and manages lifecycle\"},{\"file\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\",\"start\":49,\"end\":100,\"label\":\"Server constructor and startup\"},{\"file\":\"core/src/main/scala/kafka/server/SharedServer.scala\",\"start\":97,\"end\":132,\"label\":\"SharedServer fields and state\"}],\"explain\":{\"body\":\"KRaft is Kafka's built-in consensus mode, replacing ZooKeeper. A single JVM can act as broker, controller, or both (combined mode). This root covers how that process boots and wires its components before the Raft quorum and controller take over.\"},\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Boot sequence\",\"boxes\":[{\"id\":\"cli\",\"label\":\"CLI entry\",\"sub\":\"Kafka.main\",\"col\":0,\"row\":0,\"opens\":\"st-entry\"},{\"id\":\"raft-server\",\"label\":\"KafkaRaftServer\",\"sub\":\"assembles broker + controller\",\"col\":1,\"row\":0,\"opens\":\"st-raft-server\"},{\"id\":\"shared\",\"label\":\"SharedServer\",\"sub\":\"Raft, loader, snapshots\",\"col\":2,\"row\":0,\"opens\":\"st-shared\"},{\"id\":\"broker\",\"label\":\"BrokerServer\",\"sub\":\"serves produce/fetch\",\"col\":1,\"row\":1},{\"id\":\"controller\",\"label\":\"ControllerServer\",\"sub\":\"serves metadata APIs\",\"col\":2,\"row\":1}],\"arrows\":[{\"from\":\"cli\",\"to\":\"raft-server\",\"label\":\"buildServer\",\"at\":\"core/src/main/scala/kafka/Kafka.scala:67\"},{\"from\":\"raft-server\",\"to\":\"shared\",\"label\":\"creates\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:65\"},{\"from\":\"raft-server\",\"to\":\"broker\",\"label\":\"if broker role\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:77\"},{\"from\":\"raft-server\",\"to\":\"controller\",\"label\":\"if controller role\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:83\"},{\"from\":\"controller\",\"to\":\"shared\",\"label\":\"startForController\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:206\"},{\"from\":\"broker\",\"to\":\"shared\",\"label\":\"startForBroker\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:144\"}]}],\"edges\":[{\"from\":\"st-entry\",\"to\":\"st-raft-server\",\"state\":\"derived\",\"label\":\"buildServer\",\"order\":1},{\"from\":\"st-raft-server\",\"to\":\"st-shared\",\"state\":\"derived\",\"label\":\"startup triggers start\",\"order\":2}],\"children\":[{\"id\":\"st-entry\",\"title\":\"Entry Point\",\"sub\":\"Parse arguments and start the server process\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`Kafka.main` loads `server.properties`, applies `--override` flags, creates a `KafkaRaftServer`, registers a shutdown hook, and calls `startup()`. On fatal exception during startup it exits with code 1.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/Kafka.scala\",\"start\":31,\"end\":63,\"label\":\"getPropsFromArgs: parses CLI arguments and overrides\"},{\"file\":\"core/src/main/scala/kafka/Kafka.scala\",\"start\":65,\"end\":71,\"label\":\"buildServer: creates KafkaRaftServer\"},{\"file\":\"core/src/main/scala/kafka/Kafka.scala\",\"start\":73,\"end\":115,\"label\":\"main: signal handler, shutdown hook, startup\"}],\"explain\":{\"body\":\"This is the JVM entry point — the `main` method that the `kafka-server-start.sh` script invokes.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Parse arguments\",\"detail\":\"Load `server.properties` from the first CLI argument, then merge any `--override key=value` flags.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/Kafka.scala:51-60\"},{\"n\":2,\"title\":\"Build server\",\"detail\":\"Create `KafkaConfig` from properties and pass it to `new KafkaRaftServer`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/Kafka.scala:65-71\"},{\"n\":3,\"title\":\"Register signal handler\",\"detail\":\"On non-Windows, non-IBM JDK, register a `LoggingSignalHandler` for termination signals.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/Kafka.scala:78-85\"},{\"n\":4,\"title\":\"Add shutdown hook\",\"detail\":\"Register a JVM shutdown hook that calls `server.shutdown()`. If shutdown throws, force-halt with code 1.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/Kafka.scala:88-96\"},{\"n\":5,\"title\":\"Start and await\",\"detail\":\"Call `server.startup()`, then block on `awaitShutdown()`. Exit 0 on normal completion.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/Kafka.scala:98-113\"}]}],\"issues\":[{\"title\":\"Shutdown exception is discarded\",\"detail\":\"The shutdown hook catches all `Throwable` with a wildcard pattern, so the actual exception from `server.shutdown()` is never logged — only \\\"Halting Kafka\\\" appears before the force-halt.\",\"where\":\"core/src/main/scala/kafka/Kafka.scala:91\"}]},{\"id\":\"st-raft-server\",\"title\":\"Server Assembly\",\"sub\":\"Build broker and controller from config\",\"footprint\":{\"dirs\":[\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\"],\"files\":1},\"group\":{\"ordering\":\"sequence\"},\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`KafkaRaftServer` validates log directories, initialises metrics, creates a `SharedServer`, and conditionally creates `BrokerServer` and `ControllerServer` based on `process.roles`.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\",\"start\":49,\"end\":115,\"label\":\"Constructor, startup, shutdown, awaitShutdown\"}],\"explain\":{\"body\":\"`KafkaRaftServer` is the top-level server object for KRaft mode. It owns the broker and controller components and orchestrates their lifecycle.\"},\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Constructor and lifecycle\",\"boxes\":[{\"id\":\"logdirs\",\"label\":\"Log dir setup\",\"sub\":\"meta.properties, bootstrap\",\"col\":0,\"row\":0,\"opens\":\"st-log-dirs\"},{\"id\":\"roles\",\"label\":\"Role building\",\"sub\":\"broker and/or controller\",\"col\":1,\"row\":0,\"opens\":\"st-roles\"},{\"id\":\"lifecycle\",\"label\":\"Startup order\",\"sub\":\"controller first, broker second\",\"col\":2,\"row\":0,\"opens\":\"st-lifecycle\"},{\"id\":\"shared-s\",\"label\":\"SharedServer\",\"sub\":\"passed to both roles\",\"col\":1,\"row\":1},{\"id\":\"broker-s\",\"label\":\"BrokerServer\",\"sub\":\"optional\",\"col\":0,\"row\":1},{\"id\":\"ctrl-s\",\"label\":\"ControllerServer\",\"sub\":\"optional\",\"col\":2,\"row\":1}],\"arrows\":[{\"from\":\"logdirs\",\"to\":\"roles\",\"label\":\"metaProps\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:56\"},{\"from\":\"roles\",\"to\":\"shared-s\",\"label\":\"creates\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:65\"},{\"from\":\"roles\",\"to\":\"broker-s\",\"label\":\"if broker role\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:77\"},{\"from\":\"roles\",\"to\":\"ctrl-s\",\"label\":\"if controller role\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:83\"},{\"from\":\"lifecycle\",\"to\":\"ctrl-s\",\"label\":\"starts first\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:96\"},{\"from\":\"lifecycle\",\"to\":\"broker-s\",\"label\":\"starts second\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:97\"}]}],\"edges\":[{\"from\":\"st-log-dirs\",\"to\":\"st-roles\",\"state\":\"derived\",\"label\":\"feeds constructor\",\"order\":1},{\"from\":\"st-roles\",\"to\":\"st-lifecycle\",\"state\":\"derived\",\"label\":\"then startup\",\"order\":2}],\"children\":[{\"id\":\"st-log-dirs\",\"title\":\"Directory Setup\",\"sub\":\"Validate log directories and load meta.properties\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`initializeLogDirs` loads `meta.properties` from each configured directory, verifies node and cluster IDs, assigns directory IDs where missing, and loads `BootstrapMetadata` from the metadata log dir.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\",\"start\":131,\"end\":188,\"label\":\"initializeLogDirs: validates and initialises all log directories\"}],\"explain\":{\"body\":\"Every KRaft node stores its identity in `meta.properties` files, one per log directory. This method validates them so the node knows its cluster ID, node ID, and directory IDs before anything else runs.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Load ensemble\",\"detail\":\"Create a `MetaPropertiesEnsemble.Loader`, add metadata log dir and all data dirs, then load.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:137-140\"},{\"n\":2,\"title\":\"Verify properties\",\"detail\":\"Check at least one valid dir exists and the metadata log dir is present. Verify against the configured node ID.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:141-142\"},{\"n\":3,\"title\":\"Reject stray metadata topic\",\"detail\":\"Fail if `__cluster_metadata-0` exists in any data dir that is not the configured metadata log dir.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:145-154\"},{\"n\":4,\"title\":\"Assign directory IDs\",\"detail\":\"For each dir missing a `directoryId`, generate one and rewrite its `meta.properties`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:157-183\"},{\"n\":5,\"title\":\"Load bootstrap metadata\",\"detail\":\"Read `BootstrapMetadata` from the metadata log dir and return the ensemble and bootstrap together.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:186-187\"}]}],\"issues\":[{\"title\":\"Missing meta.properties gives generic RuntimeException\",\"detail\":\"If a directory has no `meta.properties`, the error message suggests running `kafka-storage.sh`, but the exception type is `RuntimeException` so callers cannot distinguish it from other failures.\",\"where\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:163\"}]},{\"id\":\"st-roles\",\"title\":\"Building By Role\",\"sub\":\"Create broker and controller from process.roles\",\"state\":\"partial\",\"unsure\":\"BrokerServer class is not in this repository; only its constructor call is visible.\",\"col\":0,\"row\":1,\"detail\":\"The constructor creates a `BrokerServer` if `process.roles` contains broker, and a `ControllerServer` if it contains controller. Both receive the same `SharedServer` instance.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\",\"start\":49,\"end\":90,\"label\":\"Constructor: log dirs, metrics, SharedServer, broker, controller\"}],\"explain\":{\"body\":\"`process.roles` in `server.properties` decides whether this JVM runs a broker, a controller, or both (combined mode). Each role is a separate component sharing the same Raft infrastructure.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Initialise log directories\",\"detail\":\"Call `initializeLogDirs` to get `metaPropsEnsemble` and `bootstrapMetadata`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:56-57\"},{\"n\":2,\"title\":\"Create metrics\",\"detail\":\"Initialise the `Metrics` object using the cluster ID from the loaded meta properties.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:59-63\"},{\"n\":3,\"title\":\"Create SharedServer\",\"detail\":\"Pass config, meta properties, voter connections, bootstrap servers, fault handler factory, and socket factory.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:65-74\"},{\"n\":4,\"title\":\"Create BrokerServer\",\"detail\":\"If `processRoles` contains `BrokerRole`, wrap the shared server in a `BrokerServer`.\",\"state\":\"partial\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:76-80\"},{\"n\":5,\"title\":\"Create ControllerServer\",\"detail\":\"If `processRoles` contains `ControllerRole`, create with the config schema and bootstrap metadata.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:82-90\"}]}]},{\"id\":\"st-lifecycle\",\"title\":\"Startup And Shutdown\",\"sub\":\"Controller first up, broker first down\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"Controller starts first so its endpoints reach the Raft manager before the broker needs them. On shutdown, broker stops first so it can perform controlled shutdown while the controller is still running.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala\",\"start\":92,\"end\":114,\"label\":\"startup, shutdown, awaitShutdown\"}],\"explain\":{\"body\":\"Startup and shutdown order matters because the controller must be available for the broker's controlled shutdown, and the controller's listener endpoints must be ready before the Raft manager uses them.\"},\"anatomy\":[{\"kind\":\"sequence\",\"caption\":\"Startup and shutdown order\",\"actors\":[\"KafkaRaftServer\",\"Controller\",\"Broker\"],\"rows\":[{\"from\":\"KafkaRaftServer\",\"to\":\"Controller\",\"label\":\"startup()\",\"note\":\"controller endpoints passed to Raft manager\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:96\"},{\"from\":\"KafkaRaftServer\",\"to\":\"Broker\",\"label\":\"startup()\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:97\"},{\"from\":\"KafkaRaftServer\",\"to\":\"Broker\",\"label\":\"shutdown()\",\"note\":\"broker first — may need controller for controlled shutdown\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:106\"},{\"from\":\"KafkaRaftServer\",\"to\":\"Controller\",\"label\":\"shutdown()\",\"note\":\"Raft client stops here, so broker must already be done\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/KafkaRaftServer.scala:107\"}]}]}]},{\"id\":\"st-shared\",\"title\":\"Shared Services\",\"sub\":\"Raft, metadata loader, and snapshots for both roles\",\"footprint\":{\"dirs\":[\"core/src/main/scala/kafka/server/SharedServer.scala\"],\"files\":1},\"group\":{\"ordering\":\"set\",\"note\":\"Three aspects of shared infrastructure: wiring, teardown, and error handling\"},\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"`SharedServer` holds the `KafkaRaftManager`, `MetadataLoader`, and `SnapshotGenerator` used by both broker and controller. It starts when either role needs it and stops when neither does.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/SharedServer.scala\",\"start\":97,\"end\":132,\"label\":\"SharedServer class: fields and volatile state\"},{\"file\":\"core/src/main/scala/kafka/server/SharedServer.scala\",\"start\":144,\"end\":172,\"label\":\"startForBroker and startForController: reference counting\"}],\"explain\":{\"body\":\"`SharedServer` is a singleton within the JVM that both broker and controller reference-count. Raft consensus, metadata loading, and snapshot generation exist exactly once regardless of whether the node runs one role or both.\"},\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Shared components\",\"boxes\":[{\"id\":\"wiring\",\"label\":\"Wiring\",\"sub\":\"start(): creates components\",\"col\":0,\"row\":0,\"opens\":\"st-shared-start\"},{\"id\":\"raft\",\"label\":\"KafkaRaftManager\",\"sub\":\"Raft consensus client\",\"col\":1,\"row\":0},{\"id\":\"loader\",\"label\":\"MetadataLoader\",\"sub\":\"replays Raft log\",\"col\":2,\"row\":0},{\"id\":\"faults\",\"label\":\"Fault Handlers\",\"sub\":\"fatal vs non-fatal\",\"col\":0,\"row\":1,\"opens\":\"st-fault-handlers\"},{\"id\":\"snapgen\",\"label\":\"SnapshotGenerator\",\"sub\":\"compacts metadata log\",\"col\":2,\"row\":1},{\"id\":\"teardown\",\"label\":\"Teardown\",\"sub\":\"stop + resign leadership\",\"col\":0,\"row\":2,\"opens\":\"st-shared-stop\"}],\"arrows\":[{\"from\":\"wiring\",\"to\":\"raft\",\"label\":\"creates\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:298\"},{\"from\":\"wiring\",\"to\":\"loader\",\"label\":\"creates\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:339\"},{\"from\":\"wiring\",\"to\":\"snapgen\",\"label\":\"creates\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:346\"},{\"from\":\"teardown\",\"to\":\"loader\",\"label\":\"closes\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:396\"},{\"from\":\"teardown\",\"to\":\"snapgen\",\"label\":\"closes\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:400\"},{\"from\":\"teardown\",\"to\":\"raft\",\"label\":\"shuts down\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:403\"}]}],\"children\":[{\"id\":\"st-shared-start\",\"title\":\"Wiring The Components\",\"sub\":\"Create Raft manager, loader, and snapshot generator\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"The `start` method creates `KafkaRaftManager`, `MetadataLoader`, `SnapshotEmitter`, and `SnapshotGenerator`, then registers the loader as a Raft listener. On failure it calls `stop()` to clean up.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/SharedServer.scala\",\"start\":268,\"end\":374,\"label\":\"start: creates and wires all shared components\"}],\"explain\":{\"body\":\"This wires the core Raft infrastructure: the Raft manager for consensus, the metadata loader for replaying the log into an in-memory image, and the snapshot generator for compacting old records.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Initialise role metrics\",\"detail\":\"Create `BrokerServerMetrics` if broker role, `ControllerMetadataMetrics` if controller role.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:281-286\"},{\"n\":2,\"title\":\"Create KafkaRaftManager\",\"detail\":\"Build with cluster ID, metadata serde, voter connections, and listener endpoints. Call its `startup()`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:298-315\"},{\"n\":3,\"title\":\"Create MetadataLoader\",\"detail\":\"Build the loader with this node's ID, a high-watermark accessor from the Raft client, and the metadata fault handler.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:331-339\"},{\"n\":4,\"title\":\"Create snapshot pipeline\",\"detail\":\"Build `SnapshotEmitter` (writes to Raft client) and `SnapshotGenerator` (decides when to snapshot by byte and time thresholds).\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:340-354\"},{\"n\":5,\"title\":\"Wire together\",\"detail\":\"Install the snapshot generator as a publisher on the loader, then register the loader as a Raft listener.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:356-363\"}]}]},{\"id\":\"st-shared-stop\",\"title\":\"Stopping And Cleanup\",\"sub\":\"Tear down shared components in reverse order\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`stop` shuts down loader, snapshot generator, and Raft manager in order, then closes all metrics. `ensureNotRaftLeader` shuts down the entire Raft manager to resign leadership.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/SharedServer.scala\",\"start\":376,\"end\":417,\"label\":\"ensureNotRaftLeader and stop: teardown sequence\"}],\"explain\":{\"body\":\"Teardown reverses startup, draining in-flight work before closing each component. A separate method exists to force-resign Raft leadership before controller shutdown.\"},\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Begin loader shutdown\",\"detail\":\"Signal the metadata loader to stop accepting new records.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:390-391\"},{\"n\":2,\"title\":\"Begin snapshot shutdown\",\"detail\":\"Signal the snapshot generator to stop.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:393-394\"},{\"n\":3,\"title\":\"Close loader and generator\",\"detail\":\"Close loader, its metrics, and the snapshot generator. Set each to null.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:396-401\"},{\"n\":4,\"title\":\"Shut down Raft manager\",\"detail\":\"If the Raft manager is still running, shut it down and null the reference.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:402-405\"},{\"n\":5,\"title\":\"Close all metrics\",\"detail\":\"Close controller, broker, node, and main metrics objects. Unregister AppInfo and set `started = false`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/SharedServer.scala:406-415\"}]}],\"issues\":[{\"title\":\"Metrics nulled before unregister\",\"detail\":\"`stop()` closes and nulls the `metrics` object on lines 412–413, then passes the now-null reference to `AppInfoParser.unregisterAppInfo` on line 414. The `swallow` wrapper hides the failure, so AppInfo is never unregistered.\",\"where\":\"core/src/main/scala/kafka/server/SharedServer.scala:414\"},{\"title\":\"Leadership resigned by full Raft shutdown\",\"detail\":\"`ensureNotRaftLeader` has no resign API, so it shuts down the entire `KafkaRaftManager`. The comment on line 377 acknowledges this as a temporary workaround.\",\"where\":\"core/src/main/scala/kafka/server/SharedServer.scala:378\"}]},{\"id\":\"st-fault-handlers\",\"title\":\"Fault Handlers\",\"sub\":\"Fatal and non-fatal error strategies\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"Seven fault handlers are built by `FaultHandlerFactory` as fatal or non-fatal. Most fatal handlers and the conditional metadata-loader handler disable snapshot generation via `snapshotsDisabledReason`; the raft manager handler does not.\",\"code\":[{\"file\":\"core/src/main/scala/kafka/server/SharedServer.scala\",\"start\":194,\"end\":266,\"label\":\"Seven fault handlers covering raft, loader, controller startup, initial broker metadata, quorum controller (fatal \u0026 non-fatal), and publishing\"}],\"explain\":{\"body\":\"Kafka separates fatal faults (process must die) from non-fatal ones (log and continue), using a factory pattern so tests can substitute their own handlers.\"},\"anatomy\":[{\"kind\":\"table\",\"caption\":\"Fault handler inventory\",\"columns\":[\"Handler\",\"Fatal?\",\"Side effect\"],\"state\":\"derived\",\"rows\":[[\"raftManagerFaultHandler\",\"always\",\"none\"],[\"metadataLoaderFaultHandler\",\"if controller\",\"error counts, disables snapshots\"],[\"controllerStartupFaultHandler\",\"always\",\"error counts, disables snapshots\"],[\"initialBrokerMetadataLoadFaultHandler\",\"always\",\"error counts, disables snapshots\"],[\"fatalQuorumControllerFaultHandler\",\"always\",\"error counts, disables snapshots\"],[\"nonFatalQuorumControllerFaultHandler\",\"never\",\"error counts only\"],[\"metadataPublishingFaultHandler\",\"never\",\"error counts only\"]]},{\"kind\":\"facts\",\"rows\":[{\"label\":\"Fatal implementation\",\"value\":\"`ProcessTerminatingFaultHandler` — calls `action`, then terminates the JVM\",\"state\":\"derived\"},{\"label\":\"Non-fatal implementation\",\"value\":\"`LoggingFaultHandler` — calls `action`, then logs and continues\",\"state\":\"derived\"},{\"label\":\"Snapshot disable\",\"value\":\"Most handlers set `snapshotsDisabledReason` via `compareAndSet(null, reason)` so only the first fault is recorded\",\"state\":\"derived\"}]}]}]}]},{\"id\":\"forming-the-quorum\",\"title\":\"Forming The Quorum\",\"sub\":\"Run Raft consensus, track roles, elect a leader\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"The quorum is managed by four collaborating classes: `KafkaRaftManager` wires the Raft client and network, `QuorumState` enforces role transitions, `LeaderState` tracks replication and high watermark, and `VoterSet` models the immutable voter membership.\",\"group\":{\"ordering\":\"set\",\"note\":\"Four concerns of the Raft quorum: wiring, state machine, leader duties, voter data\"},\"explain\":{\"body\":\"In KRaft (Kafka's built-in Raft), a quorum of controller nodes replicates a metadata log. Each node cycles through roles — unattached, prospective, candidate, leader, or follower — and the leader advances a *high watermark* once a majority has replicated each record. A *voter set* tracks which nodes may vote or lead.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":36,\"end\":82,\"label\":\"State transition diagram in Javadoc\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":57,\"end\":63,\"label\":\"LeaderState class header\"}],\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"How the pieces connect\",\"boxes\":[{\"id\":\"mgr\",\"label\":\"Raft Manager\",\"sub\":\"wires client, net, log\",\"col\":0,\"row\":0,\"opens\":\"rq-raft-manager\"},{\"id\":\"qs\",\"label\":\"Quorum State\",\"sub\":\"role transitions\",\"col\":1,\"row\":0,\"opens\":\"rq-quorum-state\"},{\"id\":\"ls\",\"label\":\"Leader State\",\"sub\":\"HWM, replication, epochs\",\"col\":2,\"row\":0,\"opens\":\"rq-leader-state\"},{\"id\":\"vs\",\"label\":\"Voter Set\",\"sub\":\"immutable voter membership\",\"col\":2,\"row\":1,\"opens\":\"rq-voter-set\"},{\"id\":\"raft-client\",\"label\":\"KafkaRaftClient\",\"sub\":\"drives the Raft protocol\",\"col\":1,\"row\":1},{\"id\":\"store\",\"label\":\"QuorumStateStore\",\"sub\":\"persisted election state\",\"col\":0,\"row\":1}],\"arrows\":[{\"from\":\"mgr\",\"to\":\"raft-client\",\"label\":\"builds and initializes\",\"at\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala:133\"},{\"from\":\"raft-client\",\"to\":\"qs\",\"label\":\"drives transitions\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:141\"},{\"from\":\"qs\",\"to\":\"ls\",\"label\":\"transitionToLeader\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:710\"},{\"from\":\"qs\",\"to\":\"store\",\"label\":\"persists election\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:731\"},{\"from\":\"ls\",\"to\":\"vs\",\"label\":\"reads voter set\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:142\"},{\"from\":\"qs\",\"to\":\"vs\",\"label\":\"reads voter set\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:337\"}]}],\"children\":[{\"id\":\"rq-raft-manager\",\"title\":\"Raft Manager\",\"sub\":\"Wires Raft client, network, and log\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`KafkaRaftManager` creates the metadata log, network channel, and `KafkaRaftClient`, then starts them in `startup()`. It locks the metadata log directory if it differs from the data dirs.\",\"explain\":{\"body\":\"This is the entry point that assembles the Raft stack on each KRaft node. It builds the pieces — a replicated log, a network client, a Raft protocol driver — and starts them in order.\"},\"code\":[{\"file\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala\",\"start\":87,\"end\":145,\"label\":\"Class fields and startup method\"},{\"file\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala\",\"start\":166,\"end\":189,\"label\":\"buildRaftClient and buildNetworkChannel\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Create data directory\",\"detail\":\"Creates the metadata log directory under `metadataLogDir` and optionally locks it.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala:113-127\"},{\"n\":2,\"title\":\"Build metadata log\",\"detail\":\"Creates `KafkaRaftLog` for the `__cluster_metadata` partition in the data dir.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala:129\"},{\"n\":3,\"title\":\"Build network channel\",\"detail\":\"Constructs `KafkaNetworkChannel` wrapping a `NetworkClient` on the controller listener.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala:130\"},{\"n\":4,\"title\":\"Build Raft client\",\"detail\":\"Creates `KafkaRaftClient` with the log, channel, expiration service, and KRaft version range.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala:133\"},{\"n\":5,\"title\":\"Initialize and start\",\"detail\":\"Calls `client.initialize` with quorum voters and state store, then starts the network channel and client driver.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/raft/KafkaRaftManager.scala:136-145\"}]},{\"kind\":\"facts\",\"rows\":[{\"label\":\"Controllers flush on replication\",\"value\":\"Always true when the node has ControllerRole, ensuring durability for voters\",\"state\":\"derived\"},{\"label\":\"Network client\",\"value\":\"ManualMetadataUpdater, maxInflight=1, reconnectBackoff=50ms\",\"state\":\"derived\"}]}]},{\"id\":\"rq-quorum-state\",\"title\":\"Quorum State Machine\",\"sub\":\"Enforces valid role transitions across six Raft states\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`QuorumState` holds a volatile `EpochState` and provides guarded transition methods. Durable transitions persist election state to the `QuorumStateStore` before updating memory.\",\"explain\":{\"body\":\"A Raft node is always in exactly one role: Unattached, Prospective, Candidate, Leader, Follower, or Resigned. This class is the single place that enforces which transitions are legal and persists the election state so a restart recovers the correct role.\"},\"group\":{\"ordering\":\"set\",\"note\":\"Three aspects of the state machine: initialization, election, and vote granting\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":84,\"end\":128,\"label\":\"Class fields and constructor\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":729,\"end\":743,\"label\":\"durableTransitionTo and memoryTransitionTo\"}],\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"State transitions\",\"boxes\":[{\"id\":\"init\",\"label\":\"Initialization\",\"sub\":\"restore role from store\",\"col\":0,\"row\":0,\"opens\":\"rq-qs-init\"},{\"id\":\"election\",\"label\":\"Election Path\",\"sub\":\"Prospective→Candidate→Leader\",\"col\":1,\"row\":0,\"opens\":\"rq-qs-election\"},{\"id\":\"follow\",\"label\":\"Following And Waiting\",\"sub\":\"Follower, Unattached\",\"col\":2,\"row\":0,\"opens\":\"rq-qs-follow\"},{\"id\":\"vote\",\"label\":\"Vote Granting\",\"sub\":\"log recency + voted key\",\"col\":1,\"row\":1,\"opens\":\"rq-qs-vote\"}],\"arrows\":[{\"from\":\"init\",\"to\":\"follow\",\"label\":\"most restarts\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:246\"},{\"from\":\"init\",\"to\":\"election\",\"label\":\"was candidate\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:194\"},{\"from\":\"follow\",\"to\":\"election\",\"label\":\"timeout\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:605\"},{\"from\":\"election\",\"to\":\"follow\",\"label\":\"higher epoch\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:380\"},{\"from\":\"vote\",\"to\":\"follow\",\"label\":\"grants vote\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:458\"}]}],\"children\":[{\"id\":\"rq-qs-init\",\"title\":\"Initialization\",\"sub\":\"Restore role from persisted election state\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`initialize` reads the `QuorumStateStore`, compares its epoch with the log end epoch, and creates the appropriate `EpochState`. A former leader restarts as Resigned to prevent re-voting.\",\"explain\":{\"body\":\"On startup the node must figure out what role it was in. It reads a small file that stores the last election it participated in and picks a role based on that plus what is in the log.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":130,\"end\":259,\"label\":\"readElectionState and initialize\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Read election state\",\"detail\":\"Reads persisted election from `QuorumStateStore`; defaults to epoch 0 with unknown leader if absent.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:130-139\"},{\"n\":2,\"title\":\"Epoch behind log\",\"detail\":\"If the stored epoch is less than the log's last epoch, starts as Unattached at the log's epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:155-172\"},{\"n\":3,\"title\":\"Was leader\",\"detail\":\"If the stored state says this node was leader, starts as Resigned in the same epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:173-189\"},{\"n\":4,\"title\":\"Was candidate\",\"detail\":\"If this node voted for itself, starts as Candidate in the stored epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:190-203\"},{\"n\":5,\"title\":\"Has leader with endpoints\",\"detail\":\"If a leader is known and its endpoints exist in the voter set, starts as Follower.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:232-244\"},{\"n\":6,\"title\":\"Default to Unattached\",\"detail\":\"Otherwise starts as Unattached, then calls `durableTransitionTo` to persist the chosen state.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:245-258\"}]}],\"issues\":[{\"title\":\"Unknown leader endpoints cause Unattached fallback\",\"detail\":\"If the leader's endpoints are not in the voter set (e.g. after a voter set change), the node falls back to Unattached instead of Follower and must rediscover the leader via bootstrap or BeginQuorumEpoch.\",\"where\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:207\"}]},{\"id\":\"rq-qs-election\",\"title\":\"Election Path\",\"sub\":\"Prospective to Candidate to Leader\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`transitionToProspective` starts a pre-vote round (memory-only). `transitionToCandidate` increments the epoch, and `transitionToLeader` requires a majority vote grant.\",\"explain\":{\"body\":\"A node that wants to become leader goes through three stages: Prospective (pre-vote, no epoch bump), Candidate (real vote, epoch incremented), and Leader (majority achieved). Pre-votes prevent unnecessary epoch inflation.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":605,\"end\":727,\"label\":\"transitionToProspective, transitionToCandidate, transitionToLeader\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Become Prospective\",\"detail\":\"Memory-only transition; sends PreVote requests without incrementing the epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:605-636\"},{\"n\":2,\"title\":\"Become Candidate\",\"detail\":\"Only from Prospective. Increments epoch by one and persists via `durableTransitionTo`.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:638-654\"},{\"n\":3,\"title\":\"Become Leader\",\"detail\":\"Only from Candidate with majority granted. Creates `LeaderState`; high watermark is reset to empty.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:695-727\"}]}]},{\"id\":\"rq-qs-follow\",\"title\":\"Following And Waiting\",\"sub\":\"Transition to Follower or Unattached\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"`transitionToFollower` requires a known leader with endpoints and validates epoch constraints. `transitionToUnattached` preserves the voted key when staying in the same epoch.\",\"explain\":{\"body\":\"A node that is not running an election is either a Follower (fetching from a known leader) or Unattached (no leader known). Both preserve voting history within an epoch to prevent double-voting.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":380,\"end\":420,\"label\":\"transitionToUnattached\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":529,\"end\":598,\"label\":\"transitionToFollower\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Transition to Unattached\",\"detail\":\"Enters when discovering a higher epoch or timing out from Prospective. Preserves voted key if same epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:380-419\"},{\"n\":2,\"title\":\"Transition to Follower\",\"detail\":\"Requires non-empty leader endpoints and epoch ≥ current. Rejects if already Leader in same epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:529-568\"}]},{\"kind\":\"facts\",\"rows\":[{\"label\":\"Observer timeout\",\"value\":\"Observers use Long.MAX_VALUE election timeout — they never start elections\",\"state\":\"derived\"},{\"label\":\"Same-epoch vote preservation\",\"value\":\"Both transitions keep votedKey when epoch unchanged, preventing double voting\",\"state\":\"derived\"}]}]},{\"id\":\"rq-qs-vote\",\"title\":\"Vote Granting\",\"sub\":\"Vote and pre-vote grant decisions\",\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"`unattachedOrProspectiveCanGrantVote` checks log recency for pre-votes, rejects if already voted for another candidate, and rejects if a leader is already known in this epoch.\",\"explain\":{\"body\":\"When a candidate asks for a vote, the node must decide: is the candidate's log at least as up-to-date as mine, and have I already voted for someone else? Pre-votes only check log recency; real votes also check the voted-for key.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java\",\"start\":885,\"end\":932,\"label\":\"unattachedOrProspectiveCanGrantVote\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Pre-vote check\",\"detail\":\"For pre-votes, only checks whether the candidate's log is up-to-date. No voted key constraint.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:894-901\"},{\"n\":2,\"title\":\"Already voted check\",\"detail\":\"If already voted, grants only if the candidate matches the voted key (allowing re-vote to same candidate).\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:902-914\"},{\"n\":3,\"title\":\"Known leader check\",\"detail\":\"If a leader is already known in this epoch, rejects the vote request.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:915-923\"},{\"n\":4,\"title\":\"Log recency check\",\"detail\":\"Final gate: grants only if the candidate's log is at least as up-to-date.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/QuorumState.java:924-931\"}]}]}]},{\"id\":\"rq-leader-state\",\"title\":\"Leader State\",\"sub\":\"Tracks replication, computes high watermark, writes epoch records\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"`LeaderState` holds per-voter replication offsets and timestamps, computes the high watermark from majority replication, appends leader-change control records at epoch start, and coordinates KRaft version upgrades.\",\"explain\":{\"body\":\"Once elected, the leader must replicate records to followers and advance the *high watermark* — the offset that a majority has confirmed. It also writes control records at the start of each epoch so followers can discover the new leader.\"},\"group\":{\"ordering\":\"set\",\"note\":\"Four leader duties: epoch records, high watermark, replication tracking, version upgrade\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":63,\"end\":92,\"label\":\"Class fields: voters, timers, metrics\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":110,\"end\":179,\"label\":\"Constructor: init voter states, timers, kraft upgrade\"}],\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Leader duties\",\"boxes\":[{\"id\":\"epoch-rec\",\"label\":\"Epoch Records\",\"sub\":\"leader change + voters\",\"col\":0,\"row\":0,\"opens\":\"rq-ls-epoch\"},{\"id\":\"hwm\",\"label\":\"High Watermark\",\"sub\":\"majority replication\",\"col\":1,\"row\":0,\"opens\":\"rq-ls-hwm\"},{\"id\":\"repl\",\"label\":\"Replica Tracking\",\"sub\":\"fetch offsets + check quorum\",\"col\":2,\"row\":0,\"opens\":\"rq-ls-replication\"},{\"id\":\"upgrade\",\"label\":\"KRaft Upgrade\",\"sub\":\"version 0→1\",\"col\":1,\"row\":1,\"opens\":\"rq-ls-upgrade\"},{\"id\":\"accum\",\"label\":\"BatchAccumulator\",\"sub\":\"appends control records\",\"col\":0,\"row\":1},{\"id\":\"voters\",\"label\":\"VoterSet\",\"sub\":\"immutable voter set\",\"col\":2,\"row\":1}],\"arrows\":[{\"from\":\"epoch-rec\",\"to\":\"accum\",\"label\":\"appends\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:330\"},{\"from\":\"repl\",\"to\":\"hwm\",\"label\":\"triggers update\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:812\"},{\"from\":\"upgrade\",\"to\":\"accum\",\"label\":\"appends version\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:558\"},{\"from\":\"upgrade\",\"to\":\"voters\",\"label\":\"checks support\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:515\"}]}],\"children\":[{\"id\":\"rq-ls-epoch\",\"title\":\"Epoch Control Records\",\"sub\":\"Leader-change and voters records at epoch start\",\"state\":\"derived\",\"col\":0,\"row\":0,\"detail\":\"`appendStartOfEpochControlRecords` writes a `LeaderChangeMessage` listing voters and granting voters. If KRaft reconfiguration is supported, it also appends version and voters records.\",\"explain\":{\"body\":\"At the start of every leader epoch, the leader writes special control records so followers discover who the new leader is and what the voter set looks like.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":320,\"end\":387,\"label\":\"appendStartOfEpochControlRecords\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Build LeaderChangeMessage\",\"detail\":\"Lists all voter ids and the subset that granted the vote.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:321-328\"},{\"n\":2,\"title\":\"Append leader change\",\"detail\":\"Writes the LeaderChangeMessage as a control record via the accumulator.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:330-339\"},{\"n\":3,\"title\":\"Maybe append voters record\",\"detail\":\"If KRaft reconfiguration is supported and the leader's listeners differ, appends KRaftVersionRecord and VotersRecord.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:354-381\"}]}]},{\"id\":\"rq-ls-hwm\",\"title\":\"High Watermark\",\"sub\":\"Advances when a majority has replicated\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`maybeUpdateHighWatermark` sorts voters by descending fetch offset, takes the median (index `size/2`), and advances the high watermark only if it exceeds `epochStartOffset` to enforce the epoch-commitment rule.\",\"explain\":{\"body\":\"The high watermark is the highest offset confirmed by a majority of voters. A new leader resets it and waits for followers to catch up past the epoch's start offset before advancing, ensuring no committed record is lost.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":660,\"end\":719,\"label\":\"maybeUpdateHighWatermark\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Sort voters by offset\",\"detail\":\"Collects all voter `ReplicaState` entries sorted by descending fetch offset.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:662-663\"},{\"n\":2,\"title\":\"Pick median\",\"detail\":\"Takes the entry at index `voterStates.size() / 2` — the smallest offset held by a majority.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:665-666\"},{\"n\":3,\"title\":\"Epoch start guard\",\"detail\":\"Only advances if the median offset exceeds `epochStartOffset`, enforcing the new-epoch commitment rule.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:680\"},{\"n\":4,\"title\":\"Monotonicity check\",\"detail\":\"Logs a warning if the computed HWM is lower than current — can happen during voter set changes.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:695-701\"}]}]},{\"id\":\"rq-ls-replication\",\"title\":\"Replica Tracking\",\"sub\":\"Updates fetch offsets and enforces check-quorum\",\"state\":\"derived\",\"col\":0,\"row\":2,\"detail\":\"`updateReplicaState` records each follower's fetch offset and timestamp, then triggers high watermark recomputation for voters. `updateCheckQuorumForFollowingVoter` resets the check-quorum timer when a majority has fetched.\",\"explain\":{\"body\":\"The leader tracks where each follower's log ends and when it last fetched. If a majority of voters stop fetching within 1.5× the fetch timeout, the leader steps down — this is the *check quorum* mechanism.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":779,\"end\":813,\"label\":\"updateReplicaState\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":251,\"end\":268,\"label\":\"updateCheckQuorumForFollowingVoter\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Validate replica\",\"detail\":\"Ignores negative ids (consumers) and rejects fetches from the local leader id.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:786-792\"},{\"n\":2,\"title\":\"Update follower state\",\"detail\":\"Sets the follower's end offset, last fetch timestamp, and caught-up timestamp.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:805-809\"},{\"n\":3,\"title\":\"Check quorum\",\"detail\":\"Adds the fetching voter to `fetchedVoters`; resets the check-quorum timer when a majority has fetched.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:251-268\"},{\"n\":4,\"title\":\"Maybe update HWM\",\"detail\":\"If the replica is a voter, recomputes the high watermark.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:812\"}]},{\"kind\":\"facts\",\"rows\":[{\"label\":\"Check quorum timeout\",\"value\":\"1.5× fetchTimeoutMs\",\"state\":\"derived\"},{\"label\":\"Observer session timeout\",\"value\":\"300 seconds (5 minutes)\",\"state\":\"derived\"},{\"label\":\"Single-voter cluster\",\"value\":\"Check quorum timer never expires (returns Long.MAX_VALUE)\",\"state\":\"derived\"}]}]},{\"id\":\"rq-ls-upgrade\",\"title\":\"KRaft Version Upgrade\",\"sub\":\"Upgrades kraft.version from 0 to 1\",\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"`maybeAppendUpgradedKRaftVersion` validates all voters support the new version and have known directory ids, then appends version and voter records via compare-and-set.\",\"explain\":{\"body\":\"KRaft version 1 enables dynamic reconfiguration of the voter set. The leader coordinates the upgrade by collecting each voter's supported version range, then atomically writing the version and voter records.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java\",\"start\":456,\"end\":589,\"label\":\"maybeAppendUpgradedKRaftVersion\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Validate epoch\",\"detail\":\"Rejects if the given epoch is stale or ahead of the leader's epoch.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:464\"},{\"n\":2,\"title\":\"Check pending upgrade\",\"detail\":\"Returns false (noop) if the same version is already pending; throws on concurrent different upgrade.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:466-480\"},{\"n\":3,\"title\":\"Validate voter support\",\"detail\":\"Ensures all voters support the new version and all have known directory ids.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:515-537\"},{\"n\":4,\"title\":\"Compare-and-set upgrade\",\"detail\":\"Atomically transitions from Voters to Version state; appends KRaftVersionRecord and optional VotersRecord.\",\"state\":\"derived\",\"at\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:543-580\"}]}],\"issues\":[{\"title\":\"Only version 0→1 upgrade is supported\",\"detail\":\"The code explicitly notes it only supports upgrading from kraft.version 0 to 1 and must be revisited when version 2 is added. An attempt to upgrade beyond 1 would hit validation errors.\",\"where\":\"raft/src/main/java/org/apache/kafka/raft/LeaderState.java:494\"}]}]},{\"id\":\"rq-voter-set\",\"title\":\"Voter Set\",\"sub\":\"Immutable voter membership data model\",\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"`VoterSet` wraps a map of voter id to `VoterNode`. Mutations return `Optional\u003cVoterSet\u003e`; `hasOverlappingMajority` ensures old and new sets differ by at most one member.\",\"explain\":{\"body\":\"The voter set is the list of nodes allowed to vote and lead. It is immutable — every add, remove, or update returns a new copy — so the quorum state machine always sees a consistent snapshot.\"},\"code\":[{\"file\":\"raft/src/main/java/org/apache/kafka/raft/VoterSet.java\",\"start\":48,\"end\":57,\"label\":\"Class fields and constructor\"},{\"file\":\"raft/src/main/java/org/apache/kafka/raft/VoterSet.java\  itself with the quorum so other nodes can discover its features and listeners. This root covers the `ControllerServer` class that orchestrates startup and shutdown, and the `ControllerRegistrationManager` that handles ongoing registration via KIP-919 RPCs.\"},\"code\":[{\"file\":\"core/src/main/scala/kafka/server/ControllerServer.scala\",\"start\":70,\"end\":116,\"label\":\"ControllerServer class definition and fields\"},{\"file\":\"server/src/main/java/org/apache/kafka/server/controller/ControllerRegistrationManager.java\",\"start\":55,\"end\":101,\"label\":\"ControllerRegistrationManager class and state fields\"}],\"anatomy\":[{\"kind\":\"diagram\",\"caption\":\"Controller runtime components\",\"boxes\":[{\"id\":\"startup\",\"label\":\"Controller Startup\",\"sub\":\"builds everything\",\"col\":0,\"row\":0,\"opens\":\"ct-startup\"},{\"id\":\"quorum-ctrl\",\"label\":\"QuorumController\",\"sub\":\"Raft-based controller\",\"col\":1,\"row\":0},{\"id\":\"publishers\",\"label\":\"Metadata Publishers\",\"sub\":\"eleven publisher instances\",\"col\":0,\"row\":1,\"opens\":\"ct-publishers\"},{\"id\":\"reg-mgr\",\"label\":\"Registration Manager\",\"sub\":\"KIP-919 registration RPCs\",\"col\":1,\"row\":1,\"opens\":\"ct-registration\"},{\"id\":\"raft-leader\",\"label\":\"Raft Leader\",\"sub\":\"receives registration\",\"col\":2,\"row\":1},{\"id\":\"shutdown-box\",\"label\":\"Controller Shutdown\",\"sub\":\"orderly teardown\",\"col\":0,\"row\":2,\"opens\":\"ct-shutdown\"}],\"arrows\":[{\"from\":\"startup\",\"to\":\"quorum-ctrl\",\"label\":\"builds\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:271\"},{\"from\":\"startup\",\"to\":\"publishers\",\"label\":\"installs\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:400\"},{\"from\":\"startup\",\"to\":\"reg-mgr\",\"label\":\"starts\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:427\"},{\"from\":\"publishers\",\"to\":\"reg-mgr\",\"label\":\"metadata updates\",\"at\":\"server/ ansition to STARTING\",\"detail\":\"Returns immediately if status is not SHUTDOWN. Sets startup deadline from `serverMaxStartupTimeMs`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:132-133\"},{\"n\":2,\"title\":\"Create authorizer and caches\",\"detail\":\"Creates the authorizer plugin, `KRaftMetadataCache`, `FeaturesPublisher`, `ControllerRegistrationsPublisher`, and a random `incarnationId`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:149-159\"},{\"n\":3,\"title\":\"Build SocketServer\",\"detail\":\"Creates `DelegationTokenCache`, `CredentialProvider`, and `SocketServer` with the API version manager.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:180-187\"},{\"n\":4,\"title\":\"Resolve listeners and start shared server\",\"detail\":\"Resolves wildcard hostnames and ephemeral ports, completes `socketServerFirstBoundPortFuture`, builds endpoint ready futures, calls `sharedServer.startForController`.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:189-206\"}]}]},{\"id\":\"ct-startup-quorum\",\"title\":\"Building The QuorumController\",\"sub\":\"Configure and build the Raft-based controller\",\"state\":\"derived\",\"col\":0,\"row\":1,\"detail\":\"`QuorumController.Builder` is configured with ~30 settings including replication factor, session timeout, delegation tokens, imbalance checks, and fault handlers, then `build()` is called.\",\"explain\":{\"body\":\"The QuorumController is the heart of the KRaft controller: a Raft-based state machine handling all metadata changes. Building it requires about 30 configuration parameters covering replication, timeouts, tokens, and policies.\"},\"code\":[{\"file\":\"core/src/main/scala/kafka/server/ControllerServer.scala\",\"start\":213,\"end\":271,\"label\":\"Wait for voters, configure builder, call build()\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1 "},{\"n\":2,\"title\":\"Create quota managers\",\"detail\":\"Instantiates `QuotaManagers` and `ClientQuotaMetadataManager` for controller mutation quotas.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:282-286\"},{\"n\":3,\"title\":\"Build ControllerApis\",\"detail\":\"Wires the data plane request channel, authorizer, quotas, controller, Raft manager, config, registrations publisher, and metadata cache.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:287-297\"},{\"n\":4,\"title\":\"Create handler pool\",\"detail\":\"Creates a `KafkaRequestHandlerPool` with `numIoThreads` threads processing from the data plane channel.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:298-305\"}]}]},{\"id\":\"ct-startup-enable\",\"title\":\"Enabling Request Processing\",\"sub\":\"Install publishers, start registration, open sockets\",\"state\":\"derived\",\"col\":0,\"row\":3,\"detail\":\"Installs all metadata publishers into the loader, enables the socket server for request processing, starts the registration channel and manager, then waits for authorizer futures and acceptors.\",\"explain\":{\"body\":\"The final startup phase: install all metadata publishers into the MetadataLoader, create the channel for registration RPCs, start the registration manager, and enable the socket server to begin accepting requests.\"},\"code\":[{\"file\":\"core/src/main/scala/kafka/server/ControllerServer.scala\",\"start\":397,\"end\":437,\"label\":\"Install publishers, enable processing, start registration, wait\"}],\"anatomy\":[{\"kind\":\"flow\",\"rows\":[{\"n\":1,\"title\":\"Install metadata publishers\",\"detail\":\"Calls `loader.installPublishers(metadataPublishers)` and blocks until complete or startup deadline expires.\",\"state\":\"derived\",\"at\":\"core/src/main/scala/kafka/server/ControllerServer.scala:398-400\"},{\"n\":2,\"title\":\"Enable socket server\",\"detail\":\"C
